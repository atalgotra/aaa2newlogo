# ==============================================================================
# AAA 2 Innovate — Nginx Server Configuration (SSG + SPA + SEO + Caching)
# Place this file in /etc/nginx/sites-available/aaa2innovate
# Symlink: ln -s /etc/nginx/sites-available/aaa2innovate /etc/nginx/sites-enabled/
# ==============================================================================

# 1. Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aaa2innovate.com www.aaa2innovate.com;

    return 301 https://$host$request_uri;
}

# 2. Production HTTPS Server Block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aaa2innovate.com www.aaa2innovate.com;

    # SSL Certificates (Update paths to your SSL certificate files)
    ssl_certificate /etc/letsencrypt/live/aaa2innovate.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aaa2innovate.com/privkey.pem;

    # Web Root (Path to your built project 'dist' directory)
    root /var/www/aaa2innovate/dist;
    index index.html;

    # --------------------------------------------------------------------------
    # 301 Redirects for Legacy / Consolidated Routes
    # --------------------------------------------------------------------------
    location = /about {
        return 301 /;
    }
    location = /team {
        return 301 /;
    }

    # --------------------------------------------------------------------------
    # SSG Clean URLs & SPA Routing Fallback
    # 1. Exact static file ($uri)
    # 2. Directory ($uri/)
    # 3. Pre-rendered HTML page ($uri/index.html) -> Essential for SEO subpages!
    # 4. SPA Client fallback (/index.html)
    # --------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ $uri/index.html /index.html;
    }

    # --------------------------------------------------------------------------
    # Cache Control: Pre-rendered HTML files (Never cache HTML for instant updates)
    # --------------------------------------------------------------------------
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # --------------------------------------------------------------------------
    # Cache Control: Vite Hashed Assets (JS, CSS) - Cache for 1 year
    # --------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Cache Control: Media, Images, Fonts, Video, Favicons - Cache for 30 days
    # --------------------------------------------------------------------------
    location ~* \.(mp4|webm|webp|png|jpg|jpeg|svg|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Gzip Compression for Optimal Page Speed (SEO score boost)
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
