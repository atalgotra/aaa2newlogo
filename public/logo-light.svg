<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <rect width="400" height="120" fill="#FFFFFF" rx="12" />
  
  <!-- AAA2 Monogram Symbol -->
  <g transform="translate(15, 10)">
    <!-- Left column: A A A structures -->
    <line x1="15" y1="20" x2="48" y2="20" stroke="#1D004B" stroke-width="6" stroke-linecap="square" />
    <line x1="15" y1="33" x2="48" y2="33" stroke="#1D004B" stroke-width="6" stroke-linecap="square" />
    <path d="M 15 72 L 15 46 L 48 46 L 48 72" stroke="#1D004B" stroke-width="6" fill="none" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Right column: Geometric 2 -->
    <path d="M 54 20 L 90 20 L 90 46 L 54 46 L 54 72 L 90 72" stroke="#1D004B" stroke-width="6" fill="none" stroke-linecap="square" stroke-linejoin="miter" />

    <!-- Bottom Baseline Bracket -->
    <line x1="15" y1="88" x2="90" y2="88" stroke="#1D004B" stroke-width="6" stroke-linecap="square" />
    <line x1="15" y1="80" x2="15" y2="96" stroke="#1D004B" stroke-width="6" stroke-linecap="square" />
    <line x1="90" y1="80" x2="90" y2="96" stroke="#1D004B" stroke-width="6" stroke-linecap="square" />
  </g>

  <!-- Typography: AAA 2 INNOVATE -->
  <g transform="translate(135, 0)">
    <text x="0" y="58" font-family="'Outfit', 'Space Grotesk', 'Inter', sans-serif" font-weight="800" font-size="32" fill="#1D004B" letter-spacing="4">AAA 2</text>
    <text x="0" y="86" font-family="'Outfit', 'Inter', sans-serif" font-weight="600" font-size="16" fill="#7B2CBF" letter-spacing="8">INNOVATE</text>
  </g>
</svg>
